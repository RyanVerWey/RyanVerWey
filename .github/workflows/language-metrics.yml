name: Generate language metrics

on:
  workflow_dispatch:
  schedule:
    - cron: "37 8 * * 1"

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout profile repo
        uses: actions/checkout@v7

      - name: Generate language metrics SVG
        run: python3 .github/scripts/generate_language_metrics.py
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Commit updated metrics
        run: |
          if git diff --quiet -- assets/language-metrics.svg; then
            echo "No language metric changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/language-metrics.svg
          git commit -m "Update language metrics"
          git push
