name: Generate language metrics

on:
  workflow_dispatch:
  schedule:
    - cron: "37 8 * * 1"

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      HAS_PROFILE_METRICS_TOKEN: ${{ secrets.PROFILE_METRICS_TOKEN != '' }}

    steps:
      - name: Checkout profile repo
        uses: actions/checkout@v7

      - name: Generate language metrics SVG
        if: env.HAS_PROFILE_METRICS_TOKEN == 'true'
        uses: RyanVerWey/profile-language-metrics@v1
        with:
          github_user_name: ${{ github.repository_owner }}
          output_path: assets/language-metrics.svg
          include_private: "true"
          token: ${{ secrets.PROFILE_METRICS_TOKEN }}

      - name: Keep committed private-inclusive metrics when token is missing
        if: env.HAS_PROFILE_METRICS_TOKEN != 'true'
        run: |
          echo "PROFILE_METRICS_TOKEN is not configured; keeping the committed private-inclusive metrics."

      - name: Commit updated metrics
        run: |
          if git diff --quiet -- assets/language-metrics.svg; then
            echo "No language metric changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/language-metrics.svg
          git commit -m "Update language metrics"
          git push
